
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Company</title>
    <link rel="stylesheet" href="{% static 'companies/style.css' %}">
</head>
<body>
    <div class="container">
        <div class="company-delete-page">
            <h1>Delete Company</h1>

            <p>
                Are you sure you want to delete
                <strong>{{ company.name }}</strong>?
            </p>

            <form method="POST">
                {% csrf_token %}

                <div class="company-delete-actions">
                    <a href="{% url 'company_list' %}"
                       class="company-delete-cancel">
                        Cancel
                    </a>

                    <button type="submit"
                            class="company-delete-confirm">
                        Yes, Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
