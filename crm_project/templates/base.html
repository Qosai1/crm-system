{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CRM System{% endblock %}</title>

    <link rel="stylesheet" href="{% static 'dashboard/base.css' %}">
    <script src="https://unpkg.com/lucide@latest"></script>

    {% block extra_css %}{% endblock %}
</head>

<body>

    <div class="app-layout">

        <aside class="sidebar">
            <div class="sidebar-brand">
                <span class="brand-icon">
                    <i data-lucide="layout-dashboard"></i>
                </span>
                <span>Sales System</span>

            </div>


            <nav class="sidebar-nav">
                <a href="{% url 'dashboard_home' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'dashboard_home' %}active{% endif %}">
                    <i data-lucide="layout-dashboard"></i>
                    <span>Dashboard</span>
                </a>

                <a href="{% url 'contact_list' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'contact_list' %}active{% endif %}">
                    <i data-lucide="users"></i>
                    <span>Contacts</span>
                </a>

                <a href="{% url 'company_list' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'company_list' %}active{% endif %}">
                    <i data-lucide="building-2"></i>
                    <span>Companies</span>
                </a>

                <a href="{% url 'deal_list' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'deal_list' %}active{% endif %}">
                    <i data-lucide="handshake"></i>
                    <span>Deals</span>
                </a>

                <a href="{% url 'task_list' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'task_list' %}active{% endif %}">
                    <i data-lucide="clipboard-check"></i>
                    <span>Tasks</span>
                </a>
                {% if request.user.is_superuser %}
                <a href="{% url 'create_user' %}"
                    class="sidebar-link {% if request.resolver_match.url_name == 'create_user' %}active{% endif %}">
                    <i data-lucide="user-plus"></i>
                    <span>Create User</span>
                </a>
                {% endif %}
                <div class="sidebar-logout">
                    <form method="POST" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button type="submit" class="sidebar-link logout-button">
                            <i data-lucide="log-out"></i>
                            <span>Logout</span>
                        </button>

                    </form>
                </div>

                <span class="welcome-user">
                    Welcome {{ request.user.username }}
                </span>
            </nav>
        </aside>

        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

    </div>

    <script>
        if (window.lucide) {
            lucide.createIcons();
        }
    </script>

</body>

</html>
